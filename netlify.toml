[build]
  command = "hugo --gc --minify -b $URL && npm run pagefind"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.162.0"
  NODE_VERSION = "22"
  HUGO_ENABLEGITINFO = "true"

[context.production.environment]
  HUGO_ENV = "production"

[context.deploy-preview]
  command = "hugo --gc --minify --buildFuture -b $DEPLOY_PRIME_URL && npm run pagefind"

[context.branch-deploy]
  command = "hugo --gc --minify -b $DEPLOY_PRIME_URL && npm run pagefind"

[[plugins]]
  package = "netlify-plugin-hugo-cache-resources"
  [plugins.inputs]
    debug = true
